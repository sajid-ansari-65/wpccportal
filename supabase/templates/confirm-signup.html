<!--
  Confirm-signup email. The same HTML goes into the production project:
  Supabase dashboard → Authentication → Emails → "Confirm signup".

  The link goes to /auth/confirm with a token_hash, not {{ .ConfirmationURL }},
  so it works on any device (see app/auth/confirm/route.ts).

  {{ .RedirectTo }} is already "<the site they signed up on>/auth/confirm?next=…"
  (see app/signup/actions.ts), so a preview deploy's sign-up confirms on that
  preview rather than on production. It must match a Redirect URL in Supabase,
  or Supabase swaps in the Site URL and this link breaks.
-->
<div style="background:#f2f6ff;padding:32px 16px;font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #c9d4f9;border-radius:12px;padding:32px 28px;">
    <p style="margin:0 0 20px;font-size:14px;color:#646970;">Attendance Portal</p>
    <h1 style="margin:0;font-size:24px;line-height:1.25;font-weight:600;color:#022f8c;">Confirm your email</h1>
    <p style="margin:12px 0 0;font-size:16px;line-height:1.55;color:#40464d;">
      Someone, hopefully you, created an account with this address. Confirm it to finish signing up.
    </p>
    <p style="margin:28px 0 0;">
      <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
         style="display:inline-block;background:#3858e9;color:#ffffff;text-decoration:none;font-size:16px;font-weight:500;padding:13px 22px;border-radius:8px;">
        Confirm email
      </a>
    </p>
    <p style="margin:28px 0 0;font-size:14px;line-height:1.55;color:#646970;">
      The link works once and expires in an hour. If you didn’t sign up, ignore this email. Nothing can be done with the account until this link is opened.
    </p>
  </div>
</div>
